<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Linkzsy - Game Links</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b0b0f;
      color: white;
      min-height: 100vh;
      padding: 30px 20px;
    }

    .container {
      max-width: 700px;
      margin: auto;
    }

    h1 {
      text-align: center;
      font-size: 42px;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #999;
      margin-bottom: 35px;
    }

    .game {
      background: #15151c;
      border: 1px solid #292936;
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 15px;
    }

    .game h2 {
      margin-bottom: 8px;
    }

    .game p {
      color: #999;
      margin-bottom: 15px;
    }

    .button {
      display: inline-block;
      background: #6c4cff;
      color: white;
      text-decoration: none;
      padding: 11px 18px;
      border-radius: 9px;
      font-weight: bold;
    }

    .button:hover {
      opacity: 0.8;
    }

    footer {
      text-align: center;
      color: #666;
      margin-top: 40px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Linkzsy</h1>

    <p class="subtitle">
      A collection of game links for everyone.
    </p>

    <div class="game">
      <h2>🎮 Game 1</h2>
      <p>Click below to access the game.</p>
      <a class="button" href="#" target="_blank">Play</a>
    </div>

    <div class="game">
      <h2>🎮 Game 2</h2>
      <p>Click below to access the game.</p>
      <a class="button" href="#" target="_blank">Play</a>
    </div>

    <div class="game">
      <h2>🎮 Game 3</h2>
      <p>Click below to access the game.</p>
      <a class="button" href="#" target="_blank">Play</a>
    </div>

    <footer>
      © 2026 Linkzsy
    </footer>

  </div>

</body>
</html>
